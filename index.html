<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CONECTA">
<meta name="description" content="CONECTA — A Arte de se Comunicar. Jogo educativo de comunicação com aulas, quiz, missões, XP e conquistas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>CONECTA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: app de uma coluna no celular com menu inferior; no computador o menu vira uma coluna lateral. Cartões escuros com brilho violeta e ciano. */
:root{
  --bg:#0A0F2C; --bg-2:#0F1740; --surface:#131B46; --surface-2:#1B2560; --line:rgba(157,176,255,.18);
  --fg:#EEF1FF; --muted:#A3AEDD; --violet:#8B5CF6; --cyan:#22D3EE; --ink:#04112E;
  --good:#34D399; --bad:#FB7185; --warn:#FBBF24;
  --grad:linear-gradient(90deg,#8B5CF6,#F472B6,#FBBF24,#22D3EE);
  --pink:#F472B6;
  --display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',-apple-system,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  background-color:var(--bg);
  background-image:radial-gradient(48rem 26rem at 90% -8%,rgba(139,92,246,.30),transparent 62%),radial-gradient(34rem 22rem at -10% 6%,rgba(34,211,238,.14),transparent 62%);
  background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 112px;
}
button{font-family:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:.14em;font-weight:800;display:block;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(34,211,238,.12);color:var(--cyan);font-weight:700;font-size:13px;border:1px solid rgba(34,211,238,.28);white-space:nowrap}
.warnbar{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:var(--warn);padding:10px 14px;border-radius:14px;font-size:14px}

/* base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.card h2{font-size:20px;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--cyan)}
.btn{min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:700;font-size:16px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s,filter .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--cyan);color:var(--ink);border-color:transparent}
.btn.violet{background:var(--violet);color:#fff;border-color:transparent}
.btn.danger{background:rgba(251,113,133,.14);color:var(--bad);border-color:rgba(251,113,133,.45)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.bar{height:10px;border-radius:999px;background:rgba(157,176,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}

/* hero */
.hero{border-radius:26px;padding:20px;background:linear-gradient(140deg,#4B24B8 0%,#1B2A7A 55%,#0E4E72 100%);border:1px solid rgba(190,200,255,.25);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 22px rgba(255,255,255,.04)}
.hero h1{font-size:30px;font-weight:800}
.hero .lvl{font-family:var(--display);font-size:18px;font-weight:700}
.hero .bar{background:rgba(255,255,255,.2)}
.hero .meta{display:flex;justify-content:space-between;font-size:14px;color:#D5DBFF;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 8px;text-align:center}
.stat b{font-family:var(--display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#D5DBFF}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;cursor:pointer;color:var(--fg);width:100%}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(34,211,238,.25));color:var(--cyan);flex:none}
.ico svg{width:24px;height:24px}

/* lista de aulas e quizzes */
.item-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;color:var(--fg);cursor:pointer;min-height:76px}
.item-card:hover{border-color:rgba(34,211,238,.5)}
.item-card h3{font-size:17px}
.item-card p{font-size:14px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(139,92,246,.2);color:#C9B8FF;white-space:nowrap}
.badge.ok{background:rgba(52,211,153,.16);color:var(--good)}
.badge.next{background:rgba(34,211,238,.16);color:var(--cyan)}
.check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:transparent}
.check.on{background:var(--good);border-color:var(--good);color:var(--ink)}
.check svg{width:16px;height:16px;stroke-width:3}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.seg button{min-height:46px;border-radius:13px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--fg);box-shadow:0 0 0 1px rgba(34,211,238,.4) inset}

/* aula */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--cyan);font-weight:700;font-size:15px;padding:8px 0;cursor:pointer;min-height:44px;align-self:flex-start}
.l-hero{display:flex;gap:14px;align-items:center}
.l-hero h1{font-size:28px;font-weight:800}
.l-hero .ico{width:60px;height:60px;border-radius:18px}
.l-hero .ico svg{width:30px;height:30px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:65ch}
.terms{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.terms li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28);border-radius:16px}
.terms b{color:#D7CBFF;font-family:var(--display)}
.callout{padding:14px 16px;border-radius:16px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.3);font-size:15px}
.callout b{color:var(--cyan)}
.fig{margin:0;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.fig svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.fig text{font-family:var(--body);fill:var(--fg);font-weight:700;font-size:13px;text-anchor:middle}
.fig text.m{fill:var(--muted);font-size:11.5px;font-weight:600}
.fig figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:46ch;margin:0 auto}
.example{border-left:4px solid var(--violet);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.example b{font-family:var(--display)}
.act-prompt{font-weight:600}
.item{padding:14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.item.ok{border-color:rgba(52,211,153,.55)}
.item.shake{animation:shake .35s}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer}
.cat.on{background:var(--good);color:var(--ink);border-color:transparent}
.cat.bad{opacity:.45;text-decoration:line-through}
.cat[disabled]:not(.on):not(.bad){opacity:.4}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px;min-height:60px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:rgba(34,211,238,.6)}
.opt .l{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;font-family:var(--display)}
.opt.ok{border-color:var(--good);background:rgba(52,211,153,.12)}
.opt.ok .l{background:var(--good);color:var(--ink)}
.opt.bad{border-color:var(--bad);background:rgba(251,113,133,.12)}
.opt.bad .l{background:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{padding:14px 16px;border-radius:16px;font-size:15px;animation:rise .3s}
.fb.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.45)}
.fb.bad{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.45)}
.fb b{display:block;margin-bottom:2px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted)}
.qtext{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.25}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:conic-gradient(var(--cyan) calc(var(--p)*1%),rgba(157,176,255,.16) 0);position:relative}
.score-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}
.score-ring b{position:relative;font-family:var(--display);font-size:36px;font-variant-numeric:tabular-nums}
.stars{display:flex;justify-content:center;gap:6px;color:rgba(157,176,255,.3)}
.stars svg{width:30px;height:30px}
.stars .on{color:var(--warn);fill:var(--warn)}
.xpgain{text-align:center;font-family:var(--display);font-size:26px;font-weight:800;color:var(--cyan)}

/* missões */
.mission{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.mission.done{border-color:rgba(52,211,153,.45)}
.m-head{display:flex;align-items:center;gap:12px;padding:14px;width:100%;background:none;border:0;color:var(--fg);text-align:left;cursor:pointer;min-height:68px}
.m-head h3{font-size:17px}
.m-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);width:100%;text-align:left;color:var(--fg);font-size:15px;cursor:pointer;min-height:48px}
.step .check{width:26px;height:26px}
.step[disabled]{cursor:default}

/* perfil */
.avatar{width:72px;height:72px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-family:var(--display);font-size:32px;font-weight:800;color:var(--ink);flex:none}
.field{display:flex;gap:10px}
.field input{flex:1;min-width:0;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--fg);padding:0 14px;font-size:16px;font-family:var(--body)}
.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pstat{padding:14px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line)}
.pstat b{font-family:var(--display);font-size:24px;display:block;font-variant-numeric:tabular-nums}
.pstat span{font-size:13px;color:var(--muted)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ach{padding:14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.ach .ico{width:42px;height:42px}
.ach.lock{opacity:.6}
.ach.lock .ico{background:rgba(157,176,255,.12);color:var(--muted)}
.ach.got{border-color:rgba(251,191,36,.5);background:linear-gradient(160deg,rgba(251,191,36,.1),var(--bg-2))}
.ach.got .ico{background:rgba(251,191,36,.18);color:var(--warn)}
.ach h3{font-size:15px}
.ach p{font-size:13px;color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:52px;background:none;border:0;color:var(--fg);font-size:16px;cursor:pointer;padding:0;text-align:left}
.switch i{width:50px;height:30px;border-radius:999px;background:rgba(157,176,255,.25);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true] i{background:var(--cyan)}
.switch[aria-checked=true] i::after{transform:translateX(20px)}
.levels{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.levels li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;font-size:14px;background:var(--bg-2);color:var(--muted)}
.levels li.cur{background:rgba(34,211,238,.14);color:var(--fg);font-weight:700;box-shadow:0 0 0 1px rgba(34,211,238,.45) inset}
.levels li.past{color:var(--fg)}

/* menu */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,15,44,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;background:none;color:var(--muted);font-weight:700;font-size:12px;border-radius:16px;cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--cyan);background:rgba(34,211,238,.12)}
@media(min-width:860px){
  body{padding-left:calc(104px + max(24px,env(safe-area-inset-left,0px)));padding-block:20px 48px}
  .nav{top:0;right:auto;bottom:0;width:96px;flex-direction:column;justify-content:flex-start;gap:8px;padding:24px 8px 24px calc(8px + env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line)}
  .nav button{flex:none;min-height:68px}
}

/* avisos */
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{pointer-events:none;max-width:420px;padding:12px 16px;border-radius:16px;background:#1E2A6E;color:var(--fg);border:1px solid rgba(34,211,238,.5);font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:drop .35s,fade .4s 2.6s forwards;display:flex;gap:8px;align-items:center}
.toast.xp{color:var(--cyan)}
.toast.ach{border-color:rgba(251,191,36,.7);color:var(--warn)}
.toast.lvl{border-color:rgba(139,92,246,.9);color:#D7CBFF}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(3,6,24,.78);display:grid;place-items:center;padding:16px;animation:fade-in .2s}
.modal{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;animation:rise .25s}
.modal h2{font-size:22px}

.enter{animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:0;transform:translateY(-6px)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.toast{animation:none}}
/* ===== cor e movimento ===== */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;width:56vmax;height:56vmax;opacity:.6}
.orbs i:nth-child(1){left:-24vmax;top:18vh;background:radial-gradient(circle,rgba(244,114,182,.30),transparent 65%);animation:drift1 24s ease-in-out infinite alternate}
.orbs i:nth-child(2){right:-26vmax;top:-14vmax;background:radial-gradient(circle,rgba(139,92,246,.36),transparent 65%);animation:drift2 28s ease-in-out infinite alternate}
.orbs i:nth-child(3){right:-18vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(34,211,238,.28),transparent 65%);animation:drift1 30s ease-in-out infinite alternate-reverse}
.app{position:relative;z-index:1}
@keyframes drift1{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-9vmax,7vmax) scale(.9)}}
.btn.primary{background:linear-gradient(90deg,#22D3EE,#34D399)}
.hero .btn.primary{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.55)}50%{box-shadow:0 0 0 10px rgba(34,211,238,0)}}
.bar>i{background-size:200% 100%;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:200% 0}}
.item-card{transition:transform .18s,border-color .18s,box-shadow .18s}
.item-card:hover{transform:translateY(-3px);border-color:var(--c,var(--cyan));box-shadow:0 10px 24px rgba(0,0,0,.28)}
.item-card .ico{background:var(--cs,rgba(139,92,246,.2));color:var(--c,var(--cyan));transition:transform .2s}
.item-card:hover .ico{transform:rotate(-6deg) scale(1.1)}
.enter .item-card{animation:rise .45s both;animation-delay:calc(var(--i,0)*55ms)}
.tile{transition:transform .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.grid2 .tile:nth-child(1) .ico{background:rgba(34,211,238,.18);color:var(--cyan)}
.grid2 .tile:nth-child(2) .ico{background:rgba(244,114,182,.2);color:var(--pink)}
.stat{transition:transform .2s}
.stat:hover{transform:translateY(-3px)}
.stat:nth-child(1) b{color:#FDE68A}.stat:nth-child(2) b{color:#FBCFE8}.stat:nth-child(3) b{color:#A5F3FC}
.mascot-wrap{position:absolute;right:10px;top:8px;width:96px;z-index:1}
.hero>div:nth-child(2){padding-right:92px;overflow-wrap:anywhere}
.mascot{width:100%;height:auto;display:block;overflow:visible}
.mascot .bob{animation:bob 3.2s ease-in-out infinite}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

.cat{transition:transform .15s}

.cat[data-k="0"]{border-color:#A78BFA}.cat[data-k="1"]{border-color:#22D3EE}.cat[data-k="2"]{border-color:#F472B6}.cat[data-k="3"]{border-color:#FBBF24}
.cat.on,.cat.bad{border-color:transparent}

@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}

.lw .eyebrow{color:var(--c)}

.lw .terms li{background:var(--cs);border-color:var(--cs)}

.ach.got{border-color:var(--c);background:linear-gradient(160deg,var(--cs),var(--bg-2))}
.ach.got .ico{background:var(--cs);color:var(--c)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

<script>
(function(){

/* ============ ÍCONES ============ */
var ICONS={

  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
  play:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r="1"/><circle cx="18.5" cy="14" r="1"/>',

  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 21h8M10 17h4"/>',

  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',

};
function icon(n){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>'; }
var LOGO='<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="#131B46"/><circle class="r1" cx="14" cy="20" r="7" fill="none" stroke="url(#lg)" stroke-width="3"/><circle class="r2" cx="26" cy="20" r="7" fill="none" stroke="url(#lg)" stroke-width="3"/></svg>';

/* ============ CONTEÚDO: AULAS ============ */
var LESSONS=[
{id:1,icon:'chat',title:'Comunicação: o que é?',sub:'Emissor, mensagem, receptor e contexto',
 intro:'Comunicar é trocar mensagens para que duas ou mais pessoas compartilhem ideias, sentimentos e informações. Acontece o tempo todo: numa conversa, num bilhete, numa mensagem de celular, até num olhar.',
 points:[['Emissor','Quem envia a mensagem. Pode ser você, um professor, uma amiga.'],['Mensagem','A ideia, o sentimento ou a informação que se quer passar.'],['Receptor','Quem recebe e interpreta a mensagem. Depois, pode responder e virar emissor.'],['Contexto','A situação em volta: lugar, momento, relação entre as pessoas e o que cada uma já sabe.']],
 more:'<b>Ruído</b> é tudo que atrapalha a mensagem: barulho, pressa, distração ou palavras confusas. Por isso a comunicação só dá certo quando o receptor entende o que o emissor quis dizer, e não quando o emissor termina de falar.',
 example:{title:'O “daqui a pouco” de Ana',text:'Ana manda um áudio para o Bruno: “Chego daqui a pouco”. Para ela, pouco são 10 minutos. Bruno entendeu uma hora e saiu para fazer outra coisa. A mensagem foi imprecisa e cada um a interpretou com o seu contexto. Dizer “Chego às 15h30” evitaria o problema.'},
 activity:{type:'classify',prompt:'Associe cada trecho ao elemento da comunicação que ele representa.',cats:['Emissor','Mensagem','Receptor','Contexto'],items:[
  {t:'Marina, que está contando uma novidade ao irmão.',a:0},
  {t:'O irmão de Marina, que ouve e interpreta o que ela diz.',a:2},
  {t:'A frase “Passei na prova!”.',a:1},
  {t:'Uma sala barulhenta durante o intervalo da escola.',a:3},
  {t:'Carlos, que escreve um bilhete para um colega.',a:0}]}},
{id:2,icon:'ear',title:'Escuta ativa',sub:'Atenção, silêncio respeitoso e interesse',
 intro:'Ouvir é um ato do corpo: o som chega aos ouvidos. Escutar é prestar atenção ao sentido do que o outro diz. A escuta ativa é escutar de propósito, com atenção total e mostrando isso à pessoa.',
 points:[['Prestar atenção','Guarde o celular, olhe para a pessoa e deixe distrações de lado.'],['Não interromper','Espere a pessoa terminar a ideia antes de falar. Pausas fazem parte da conversa.'],['Demonstrar interesse','Acene, mantenha o olhar e faça perguntas abertas, como “Como você se sentiu?”.'],['Parafrasear','Repita com as suas palavras o que entendeu: “Se entendi bem, você ficou chateado porque…”.']],
 more:'Evite dar conselho cedo demais. Muitas vezes quem desabafa quer, primeiro, ser compreendido. Resolver o problema vem depois.',
 example:{title:'Léo e a apresentação',text:'Léo conta que está nervoso com a apresentação de amanhã. Resposta ruim: “Ah, eu já passei por coisa pior…”, que tira o foco dele. Resposta com escuta ativa: “Parece que isso te preocupa muito. O que mais te deixa nervoso?”.'},
 activity:{type:'choose',prompt:'Camila diz: “Estou chateada, briguei com minha melhor amiga.” Qual resposta mostra escuta ativa?',options:[
  {t:'“Isso não é nada. Semana passada eu briguei com três pessoas!”',ok:0,fb:'Isso muda o foco para você e diminui o que ela sente.'},
  {t:'“Você parece triste com isso. Quer me contar o que aconteceu?”',ok:1,fb:'Você reconhece o sentimento e convida a pessoa a falar.'},
  {t:'“Esquece isso, vamos falar de outra coisa.”',ok:0,fb:'Mudar de assunto mostra que você não quer escutar.'},
  {t:'“Você deve ter errado, né? Pede desculpa logo.”',ok:0,fb:'Julgar e aconselhar antes de entender fecha a conversa.'}]}},
{id:3,icon:'mic',title:'Comunicação verbal',sub:'Clareza, tom de voz e escolha das palavras',
 intro:'Comunicação verbal é tudo que expressamos com palavras, faladas ou escritas. Não basta ter uma boa ideia: é preciso dizê-la de um jeito que o outro consiga entender.',
 points:[['Clareza','Frases curtas, uma ideia por vez e informações precisas, como dia, hora e lugar.'],['Tom de voz','Volume, ritmo e entonação mudam o sentido. “Tudo bem.” pode soar carinhoso ou irritado.'],['Escolha das palavras','Use palavras que o outro conhece. Evite “sempre” e “nunca” em críticas, porque soam como ataque.'],['Pausas','Dão tempo para o outro acompanhar e destacam o que é importante.']],
 more:'Antes de falar algo importante, pergunte-se: o que eu quero que a outra pessoa entenda e faça depois de me ouvir?',
 example:{title:'Pedido confuso, pedido claro',text:'“Faz aquilo lá pra mim?” deixa o outro adivinhando. “Pode enviar o relatório até as 17h?” diz o que, quando e para quem. O segundo pedido evita perguntas, atrasos e irritação.'},
 activity:{type:'classify',prompt:'Classifique cada frase como clara ou confusa.',cats:['Clara','Confusa'],items:[
  {t:'“Preciso do trabalho pronto até sexta, às 18h.”',a:0},
  {t:'“Me manda aquilo quando der.”',a:1},
  {t:'“Vamos nos encontrar às 14h na entrada da biblioteca.”',a:0},
  {t:'“A gente se vê por aí, depois a gente combina o negócio.”',a:1},
  {t:'“Não gostei da nota. Posso conversar com você sobre os critérios?”',a:0}]}},
{id:4,icon:'hand',title:'Comunicação não verbal',sub:'Gestos, postura e expressões do rosto',
 intro:'Mesmo em silêncio comunicamos. A comunicação não verbal reúne gestos, postura, expressão do rosto, contato visual, distância entre as pessoas e até o jeito da voz.',
 points:[['Gestos','Mãos e cabeça reforçam ou substituem palavras, como um aceno ou um polegar para cima.'],['Postura','Corpo voltado para a pessoa mostra atenção. Ombros caídos podem indicar cansaço ou desânimo.'],['Expressão facial','Sorriso, testa franzida e sobrancelhas erguidas mostram emoções.'],['Contato visual','Olhar de forma natural transmite interesse e confiança.']],
 more:'Quando as palavras dizem uma coisa e o corpo outra, as pessoas tendem a acreditar mais no corpo e no tom de voz. Mas atenção: um único gesto não prova nada. Observe o conjunto e lembre que culturas diferentes dão significados diferentes aos gestos.',
 example:{title:'“Estou ouvindo”',text:'Pedro diz “estou ouvindo”, mas está de braços cruzados e olhando o relógio. A mensagem verbal diz uma coisa e o corpo diz outra. Quem fala percebe e sente que não é importante.'},
 activity:{type:'choose',prompt:'Um colega diz “estou ótimo!”, mas está com os ombros caídos, olhando para o chão e com a voz baixa. O que é melhor fazer?',options:[
  {t:'Dizer que ele está mentindo e cobrar a verdade.',ok:0,fb:'Concluir sozinho e cobrar pode deixá-lo na defensiva.'},
  {t:'Ignorar, porque ele disse que está tudo bem.',ok:0,fb:'Os sinais do corpo mostram que pode haver algo errado.'},
  {t:'Perguntar com gentileza se está tudo bem e deixar a porta aberta para conversar.',ok:1,fb:'Você usa os sinais como pista e respeita o tempo dele.'},
  {t:'Rir e fazer uma brincadeira sobre o jeito dele.',ok:0,fb:'Brincar pode magoar alguém que já não está bem.'}]}},
{id:5,icon:'heart',title:'Empatia',sub:'Diferentes perspectivas e sentimentos',
 intro:'Empatia é a capacidade de compreender o que outra pessoa sente e pensa, olhando a situação do ponto de vista dela. Ela é a base de boas conversas e de boas amizades.',
 points:[['Empatia não é concordar','Você pode entender o motivo de alguém se sentir assim sem concordar com tudo.'],['Empatia não é pena','Pena olha de cima. Empatia olha de igual para igual.'],['Perguntar antes de julgar','“O que aconteceu?” revela o que a aparência não mostra.'],['Validar sentimentos','Dizer “faz sentido você se sentir assim” acolhe, sem precisar resolver nada.']],
 more:'Frases que minimizam, como “não foi nada” ou “relaxa”, fazem a pessoa se sentir ainda mais sozinha. Prefira reconhecer o que ela sente.',
 example:{title:'O colega atrasado',text:'Um colega chega atrasado ao trabalho em grupo e você fica irritado. Depois descobre que ele levou o irmão pequeno ao médico. Ao perguntar primeiro, você vê a situação inteira e escolhe uma resposta melhor.'},
 activity:{type:'choose',prompt:'Seu colega perdeu o campeonato e está desanimado. Qual resposta é empática?',options:[
  {t:'“Não foi nada, é só um jogo.”',ok:0,fb:'Isso minimiza o sentimento dele.'},
  {t:'“Eu avisei que ia dar errado.”',ok:0,fb:'Cobrar o erro só aumenta a tristeza.'},
  {t:'“Imagino que seja frustrante depois de tanto treino. Quer conversar?”',ok:1,fb:'Você reconhece o que ele sente e se coloca à disposição.'},
  {t:'“Tem gente com problemas bem piores, sabia?”',ok:0,fb:'Comparar dores invalida o que a pessoa sente.'}]}},
{id:6,icon:'shield',title:'Comunicação assertiva',sub:'Opiniões expressas com respeito',
 intro:'Assertividade é dizer o que pensa, sente e precisa com clareza e respeito, considerando também o outro. Existem três jeitos de reagir diante de um desconforto.',
 points:[['Passivo','Se cala, evita conflito e concorda com tudo. Costuma acumular ressentimento.'],['Agressivo','Impõe, grita, acusa ou humilha. Resolve na hora e destrói a confiança.'],['Assertivo','Fala com firmeza e gentileza, focando no fato e no que sente.']],
 more:'Uma boa técnica é a mensagem em primeira pessoa: “Eu me sinto [sentimento] quando [situação]. Gostaria que [pedido].” Ser assertivo não garante que o outro concorde, mas garante que você se expressou com respeito.',
 example:{title:'Trabalho em grupo',text:'Um colega não entregou a sua parte. Passivo: faz tudo calado. Agressivo: “Você é um irresponsável!”. Assertivo: “Fiquei preocupada porque a sua parte não chegou. Podemos combinar um novo prazo hoje?”.'},
 activity:{type:'classify',prompt:'Classifique cada reação em passiva, agressiva ou assertiva.',cats:['Passiva','Agressiva','Assertiva'],items:[
  {t:'“Tudo bem, eu refaço de novo. Não tem problema.” (e fica com raiva em silêncio)',a:0},
  {t:'“Você nunca escuta ninguém, é impossível trabalhar com você!”',a:1},
  {t:'“Prefiro não emprestar meu caderno hoje, mas posso te ajudar a resumir a matéria.”',a:2},
  {t:'“Cala a boca, a minha ideia é a única que presta!”',a:1},
  {t:'“Eu discordo dessa parte do plano. Posso explicar meu motivo?”',a:2},
  {t:'Fica quieto e concorda com tudo para não causar problema.',a:0}]}},
{id:7,icon:'duo',title:'Conflitos e diálogo',sub:'Resolver desentendimentos sem agressividade',
 intro:'Conflitos fazem parte da vida: pessoas pensam e sentem diferente. O problema não é discordar, e sim o jeito como lidamos com isso. Dá para resolver sem gritos nem ofensas.',
 points:[['1. Respirar','Espere a emoção baixar antes de falar. Decisões tomadas com raiva costumam piorar tudo.'],['2. Escolher o momento','Converse em particular, com calma e sem plateia.'],['3. Falar do fato','Descreva o que aconteceu e o que sentiu, sem atacar a pessoa.'],['4. Escutar a outra versão','Pergunte e escute. Pode haver algo que você não sabia.'],['5. Buscar soluções','Procure um acordo que respeite os dois lados e combine o próximo passo.']],
 more:'Se a conversa não avança e a tensão cresce, peça ajuda de alguém de confiança, como um professor ou um responsável, para mediar. Evite ironia, ofensas, generalizações e trazer assuntos antigos.',
 example:{title:'O segredo contado',text:'Duas amigas brigam porque uma contou um segredo da outra. Em vez de expor a amiga no grupo, a que se magoou espera passar a raiva, a chama para conversar em particular, explica como se sentiu e escuta a explicação. Juntas combinam como guardar segredos daí em diante.'},
 activity:{type:'choose',prompt:'Você descobriu que um amigo contou algo que você disse em segredo. Qual primeira atitude ajuda a resolver sem agressividade?',options:[
  {t:'Contar um segredo dele para o grupo, para ficarem quites.',ok:0,fb:'Revidar cria uma briga ainda maior.'},
  {t:'Parar de falar com ele sem explicar nada.',ok:0,fb:'O silêncio sem explicação deixa o problema sem solução.'},
  {t:'Respirar, chamá-lo para conversar em particular e explicar como se sentiu.',ok:1,fb:'Você cuida da emoção, escolhe o momento e foca no que sentiu.'},
  {t:'Escrever no grupo o que ele fez, para todos saberem.',ok:0,fb:'Expor a pessoa em público transforma o problema em humilhação.'}]}},
{id:8,icon:'phone',title:'Comunicação digital',sub:'Mensagens, mal-entendidos e responsabilidade online',
 intro:'Em mensagens de texto faltam tom de voz, rosto e gestos. Por isso é fácil entender errado. Além disso, o que é publicado pode ser copiado, compartilhado e continuar existindo por muito tempo.',
 points:[['Releia antes de enviar','Pergunte-se como a outra pessoa vai entender o que você escreveu.'],['Cuidado com MAIÚSCULAS','Textos todos em maiúsculas parecem gritos.'],['Pergunte antes de supor','Se algo pareceu rude, pergunte “o que você quis dizer?”.'],['Respeite a privacidade','Não repasse prints, fotos ou áudios de outras pessoas sem permissão.'],['Confira antes de repassar','Verifique se uma notícia é confiável antes de compartilhar.']],
 more:'Ao ver alguém ser humilhado online, não entre na brincadeira. Apoie a pessoa, guarde as provas, avise um adulto de confiança e use as ferramentas de denúncia da plataforma.',
 example:{title:'Um “ok.” que pareceu frio',text:'Julia responde “ok.” ao convite de uma amiga. A amiga entende como irritação, mas Julia só estava ocupada. Um “Ok! Combinado 😊” teria passado o tom certo. Na dúvida, pergunte em vez de supor.'},
 activity:{type:'classify',prompt:'Classifique cada atitude como boa prática ou algo a evitar.',cats:['Boa prática','Evitar'],items:[
  {t:'Reler a mensagem antes de enviar.',a:0},
  {t:'Responder na hora, com raiva.',a:1},
  {t:'Perguntar o que a pessoa quis dizer antes de supor.',a:0},
  {t:'Compartilhar print de uma conversa privada sem permissão.',a:1},
  {t:'Checar se uma notícia é confiável antes de repassar.',a:0},
  {t:'Escrever tudo em CAIXA ALTA.',a:1}]}}
];

var QRAW=[
[1,'Qual alternativa lista os elementos básicos da comunicação?','Emissor, mensagem, receptor e contexto.','Apenas emissor e receptor, sem mensagem.','Voz, rosto, texto e imagem.','Falante, ouvinte e silêncio.','Toda comunicação envolve quem envia, o que é enviado, quem recebe e a situação em que isso acontece.'],
[1,'Na comunicação, o receptor é:','Quem recebe e interpreta a mensagem.','Quem sempre começa a conversa.','O aparelho ou canal por onde a mensagem passa.','Quem fala mais alto.','O receptor interpreta a mensagem e pode responder, virando emissor. Quem começa ou fala mais alto não define o papel.'],
[1,'Ana disse “chego daqui a pouco”. Bruno entendeu uma hora, mas ela quis dizer 10 minutos. O que causou o mal-entendido?','Uma mensagem imprecisa, interpretada em um contexto diferente.','Bruno é distraído por natureza.','O celular de Ana estava com defeito.','Mensagens curtas sempre dão errado.','“Daqui a pouco” não tem medida exata. Cada pessoa interpretou com a sua referência, e uma hora combinada resolveria.'],
[1,'O que é “ruído” na comunicação?','Qualquer coisa que atrapalha a mensagem, como barulho, distração ou pressa.','Apenas música alta.','A resposta que o receptor dá.','O assunto da conversa.','Ruído é tudo que dificulta a mensagem de chegar inteira, e não só barulho de verdade.'],
[1,'Quando podemos dizer que a comunicação deu certo?','Quando o receptor entende a mensagem como o emissor pretendia.','Quando o emissor termina de falar.','Quando o receptor concorda com tudo.','Quando a conversa é longa.','A comunicação se completa na compreensão. Concordar não é preciso, e falar muito não garante entendimento.'],

[2,'Um amigo está contando um problema. Qual atitude demonstra escuta ativa?','Prestar atenção e fazer perguntas para compreender melhor.','Interromper para contar uma história própria.','Continuar olhando para o celular.','Mudar de assunto.','Escuta ativa é atenção total ao outro. Interromper, olhar o celular ou mudar de assunto mostram desinteresse.'],
[2,'Qual é um exemplo de pergunta aberta que demonstra interesse?','“Como você se sentiu nessa situação?”','“Foi ruim, né?”','“Você vai fazer isso mesmo?”','“Já terminou de falar?”','Perguntas abertas não se respondem só com sim ou não, e por isso convidam a pessoa a contar mais.'],
[2,'Parafrasear, na escuta ativa, significa:','Repetir com suas palavras o que entendeu, para confirmar.','Repetir exatamente as mesmas palavras, como um eco.','Corrigir o jeito de a pessoa falar.','Resumir o que ouviu para dar a sua opinião.','Parafrasear confirma que você entendeu certo. Copiar palavra por palavra ou opinar logo em seguida não cumpre esse papel.'],
[2,'Durante a explicação de um professor, qual atitude mostra escuta ativa?','Olhar para ele, anotar e esperar para perguntar quando terminar um ponto.','Conversar baixinho com o colega.','Terminar as frases dele para acelerar.','Mexer no celular, ouvindo de canto de ouvido.','Atenção, anotações e perguntas na hora certa mostram respeito e ajudam a aprender.'],
[2,'Uma colega desabafa e você já pensa no conselho que vai dar. Qual é o risco?','Deixar de prestar atenção no que ela realmente diz e sente.','Nenhum, aconselhar rápido sempre ajuda.','Ela vai falar mais.','A conversa fica melhor por ficar mais curta.','Quando pensamos na resposta, paramos de escutar. Muitas vezes a pessoa precisa primeiro ser compreendida.'],

[3,'Qual pedido é o mais claro?','“Pode me entregar o resumo até quarta, às 10h?”','“Me dá aquilo depois.”','“Resolve isso aí quando puder.”','“Você sabe o que eu quero, né?”','O pedido claro diz o que, para quando e a que horas. Os outros obrigam o outro a adivinhar.'],
[3,'Sobre o tom de voz, é correto afirmar que:','Ritmo, volume e entonação podem mudar o sentido da mesma frase.','Só importa quando alguém grita.','Não altera o sentido se as palavras forem educadas.','Só é importante para quem canta.','“Tudo bem.” dito com carinho ou com irritação quer dizer coisas bem diferentes.'],
[3,'Qual frase evita a generalização que provoca defesa?','“Hoje você chegou atrasado e isso me atrapalhou.”','“Você sempre se atrasa.”','“Você nunca respeita ninguém.”','“Todo mundo já cansou de você.”','Falar de um fato específico é mais justo e mais fácil de resolver. “Sempre” e “nunca” soam como ataque.'],
[3,'Ao explicar algo para quem não conhece o assunto, o melhor é:','Usar palavras simples, frases curtas e exemplos.','Usar termos técnicos para impressionar.','Falar bem rápido para não cansar.','Falar tudo de uma vez, sem pausas.','Quem explica quer ser entendido. Linguagem simples e exemplos ajudam o outro a acompanhar.'],
[3,'Para que servem as pausas na fala?','Dar tempo para o outro entender e destacar ideias importantes.','Mostrar que você esqueceu o que ia dizer.','Indicar que a conversa acabou.','Irritar o receptor.','Pausas organizam a fala e dão ritmo. Sem elas, o receptor se perde.'],

[4,'A comunicação não verbal inclui:','Gestos, postura, expressões faciais e contato visual.','Apenas a escrita.','Só as palavras faladas.','Somente mensagens digitais.','Comunicamos também sem palavras, com o corpo, o rosto e o olhar.'],
[4,'Quando as palavras e o corpo se contradizem, as pessoas tendem a:','Acreditar mais nos sinais do corpo e no tom de voz.','Confiar apenas nas palavras.','Não perceber a diferença.','Rir da situação.','O corpo costuma revelar emoções difíceis de esconder, por isso pesa mais na interpretação.'],
[4,'Alguém diz “claro, pode falar”, mas está de braços cruzados e rosto fechado. Qual é o melhor cuidado?','Observar o conjunto de sinais e perguntar, sem concluir sozinho.','Concluir com certeza que a pessoa está mentindo.','Ignorar os sinais do corpo.','Tomar um único gesto como prova absoluta.','Sinais são pistas, não provas. Braços cruzados também podem ser frio ou hábito. Perguntar é o jeito mais seguro.'],
[4,'Em uma entrevista de estágio, qual postura transmite atenção e respeito?','Corpo voltado para o entrevistador, contato visual natural e rosto receptivo.','Olhar o celular entre as perguntas.','Ficar curvado, olhando para o chão o tempo todo.','Balançar a perna e olhar para o teto.','Postura aberta e olhar natural mostram interesse. Os outros sinais passam desinteresse ou insegurança.'],
[4,'Um mesmo gesto pode ter significados diferentes entre culturas?','Sim, gestos mudam de sentido conforme a cultura e o contexto.','Não, todos os gestos são universais.','Só quando acompanhados de palavras.','Apenas entre crianças.','Um gesto simpático em um país pode ser ofensivo em outro. Vale ter cuidado ao viajar ou falar com quem vem de outra cultura.'],

[5,'Empatia é:','Tentar compreender o que o outro sente e pensa, do ponto de vista dele.','Concordar com tudo que a pessoa diz.','Sentir pena de quem sofre.','Dar sempre um conselho.','Empatia é compreender. Não exige concordar, olhar de cima ou aconselhar.'],
[5,'Uma colega tirou nota baixa e está triste. Qual resposta é empática?','“Deve ser frustrante, você estudou bastante. Quer conversar?”','“Nota não é tudo, supera.”','“Eu já tirei pior e fiquei bem.”','“Te avisei que ia ser difícil.”','A resposta empática reconhece o sentimento e se oferece para ouvir. As outras minimizam, comparam ou cobram.'],
[5,'Ter empatia significa concordar com a pessoa?','Não, é possível compreender os sentimentos sem concordar.','Sim, sempre.','Sim, mas só com amigos.','Sim, mas só com a família.','Podemos entender por que alguém se sente de um jeito sem concordar com a atitude dessa pessoa.'],
[5,'Um motorista de ônibus está ríspido. Qual atitude é mais empática?','Considerar que ele pode estar cansado ou estressado e manter a gentileza, sem aceitar desrespeito.','Responder no mesmo tom.','Reclamar alto para todos ouvirem.','Ignorá-lo e falar mal dele depois.','Imaginar o que pode estar por trás ajuda a reagir com calma. Empatia não obriga a aceitar grosseria.'],
[5,'Validar o sentimento de alguém é:','Reconhecer que o que ela sente faz sentido para ela, sem precisar resolver.','Dizer que ela está exagerando.','Mudar de assunto para animá-la.','Provar que ela está errada.','Validar acolhe. Frases como “faz sentido você se sentir assim” ajudam a pessoa a se abrir.'],

[6,'Comunicação assertiva é:','Expressar opiniões e necessidades com clareza e respeito.','Impor a própria opinião.','Concordar sempre para evitar briga.','Evitar falar para não magoar.','Assertividade fica no meio: nem se cala como o passivo, nem ataca como o agressivo.'],
[6,'Qual é um exemplo de mensagem em primeira pessoa?','“Eu me sinto chateado quando meus planos mudam sem aviso.”','“Você é muito desorganizado.”','“Todo mundo acha você egoísta.”','“Você nunca avisa nada.”','A mensagem em primeira pessoa descreve o que você sente, e não rotula o outro, e por isso gera menos defesa.'],
[6,'Alguém pede algo emprestado e você não quer emprestar. Qual resposta é assertiva?','“Prefiro não emprestar isso, mas posso ajudar de outro jeito.”','“Claro...” (e fica contrariado).','“Nem pensar, você estraga tudo.”','Não responder e fingir que não viu.','A resposta assertiva diz “não” com clareza e gentileza e ainda oferece uma alternativa.'],
[6,'O estilo de comunicação passivo costuma gerar:','Ressentimento acumulado, porque as necessidades não são ditas.','Respeito automático.','Conflitos resolvidos rapidamente.','Mais clareza nas conversas.','Quem se cala sempre guarda o desconforto, e ele costuma explodir depois.'],
[6,'Ser assertivo garante que o outro vai concordar?','Não, garante apenas que você se expressou com respeito. O outro pode discordar.','Sim, sempre.','Sim, se você falar mais alto.','Sim, se o outro for mais novo.','Assertividade trata do seu jeito de comunicar, não de controlar a resposta do outro.'],

[7,'Quando você está muito emocionado numa discussão, o primeiro passo é:','Respirar e esperar a emoção baixar.','Falar tudo que pensa enquanto sente.','Mandar uma mensagem longa na hora.','Procurar uma plateia que concorde.','Com a raiva alta, dizemos o que não queremos. Esperar um pouco torna a conversa mais produtiva.'],
[7,'Qual abordagem foca no problema, e não na pessoa?','“Quando a tarefa atrasa, o grupo todo é prejudicado. Como podemos resolver?”','“Você é irresponsável.”','“Sempre sobra pra mim por sua culpa.”','“Típico de você.”','Falar do fato e propor solução evita que o outro se sinta atacado e se defenda.'],

function defaults(){return {v:1,name:'',xp:0,lessons:{},missions:{},missionSteps:{},mastered:{},quizBest:{},quizPlays:0,quizBonus:{},ach:{},settings:{sound:true}};}
function isObj(o){return o&&typeof o==='object'&&!Array.isArray(o);}
function load(){
  var d=defaults(), raw=readStore(); if(!raw) return d;
  try{
    var p=JSON.parse(raw); if(!isObj(p)) return d;
    if(typeof p.name==='string') d.name=p.name.slice(0,20);
    if(typeof p.xp==='number'&&isFinite(p.xp)&&p.xp>0) d.xp=Math.floor(p.xp);
    ['lessons','missions','missionSteps','mastered','quizBest','quizBonus','ach'].forEach(function(k){ if(isObj(p[k])) d[k]=p[k]; });
    if(typeof p.quizPlays==='number') d.quizPlays=p.quizPlays;
    if(isObj(p.settings)&&typeof p.settings.sound==='boolean') d.settings.sound=p.settings.sound;
  }catch(e){}
  return d;
}
var state=load();
function save(){ writeStore(JSON.stringify(state)); }

function levelInfo(xp){
  var lv=1; for(var i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].xp) lv=LEVELS[i].n; }
  var cur=LEVELS[lv-1], nxt=LEVELS[lv]||null;
  var pct=nxt?Math.round((xp-cur.xp)/(nxt.xp-cur.xp)*100):100;
  return {lv:lv,cur:cur,nxt:nxt,pct:pct,left:nxt?nxt.xp-xp:0};
}
function overallPct(){
  var a=nLessons(state)/LESSONS.length, b=nMissions(state)/MISSIONS.length, c=Object.keys(state.mastered).length/QUESTIONS.length;
  return Math.round((a+b+c)/3*100);
}

var confCv=null, confP=[], confRaf=0;
function confTick(){
  var ctx=confCv.getContext('2d'), d=confCv._d||1;
  ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,confCv.width,confCv.height);
  confP=confP.filter(function(p){return p.life<p.max;});
  confP.forEach(function(p){
    p.life++; p.vy+=.28; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
    if(p.shape===0) ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
    else if(p.shape===1){ ctx.beginPath(); ctx.arc(0,0,p.r/1.4,0,6.3); ctx.fill(); }
    else ctx.fillRect(-p.r/2,-p.r,p.r,p.r*2);
    ctx.restore();
  });
  if(confP.length) confRaf=requestAnimationFrame(confTick); else { confRaf=0; ctx.clearRect(0,0,confCv.width,confCv.height); }
}
function confetti(x,y,n){
  if(REDUCED) return;
  try{
    if(!confCv){ confCv=document.createElement('canvas'); confCv.className='confetti'; confCv.setAttribute('aria-hidden','true'); document.body.appendChild(confCv); }
    var d=Math.min(window.devicePixelRatio||1,2); confCv._d=d;
    confCv.width=Math.round(window.innerWidth*d); confCv.height=Math.round(window.innerHeight*d);
    var cols=['#8B5CF6','#22D3EE','#F472B6','#FBBF24','#34D399','#FB7185','#60A5FA'];
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25, sp=6+Math.random()*9;
      confP.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3+Math.random()*4,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:0,max:70+Math.random()*50,shape:i%3});
    }
    if(!confRaf) confRaf=requestAnimationFrame(confTick);
  }catch(e){}
}
function animateResult(){
  var q=ui.quiz, ring=document.querySelector('.score-ring'); if(!q||!ring) return;
  var total=q.qs.length, pct=Math.round(q.score/total*100), b=ring.querySelector('b');
  if(REDUCED){ ring.style.setProperty('--p',pct); return; }
  var t0=null; ring.style.setProperty('--p',0); b.textContent='0/'+total;
  function f(ts){
    if(!document.body.contains(ring)) return;
    if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/900), e=1-Math.pow(1-k,3);
    ring.style.setProperty('--p',pct*e); b.textContent=Math.round(q.score*e)+'/'+total;
    if(k<1) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
  if(pct>=60) setTimeout(function(){ confetti(window.innerWidth/2,window.innerHeight*0.32,pct>=90?170:100); },350);
}

function beep(kind){
  if(!state.settings.sound) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!actx) actx=new AC(); if(actx.state==='suspended') actx.resume();
    var seq=kind==='ok'?[[660,0],[880,.11]]:kind==='bad'?[[220,0],[170,.12]]:kind==='lvl'?[[523,0],[659,.1],[784,.2],[1047,.3]]:[[600,0]];
    seq.forEach(function(n){
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+n[1];
      o.type='sine';o.frequency.value=n[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.2);
    });
  }catch(e){}
}

function viewPlay(){
  var seg='<div class="seg" role="group" aria-label="Escolha"><button data-act="playTab" data-a="quiz" aria-pressed="'+(ui.playTab==='quiz')+'">Quiz</button><button data-act="playTab" data-a="missions" aria-pressed="'+(ui.playTab==='missions')+'">Missões</button></div>';

function bestTxt(key){ var b=state.quizBest[key]; return b?'Melhor: '+b.s+'/'+b.t:'Ainda não jogado'; }
function viewQuizMenu(){
  var mastered=Object.keys(state.mastered).length;
  return '<section class="card stack"><div><h2>Como funciona</h2><p class="muted small">Responda, veja a explicação e avance. Você ganha '+Q_XP+' XP na primeira vez que acerta cada pergunta e '+QUIZ_BONUS+' XP extras ao acertar 80% ou mais em um quiz de aula, uma vez por aula. Repetir perguntas já dominadas é treino sem XP. Perguntas dominadas: <b>'+mastered+'/'+QUESTIONS.length+'</b>.</p></div></section>'+
  '<button class="item-card" style="--c:#22D3EE;--cs:#22D3EE3a;--i:0" data-act="startQuiz" data-a="mix"><span class="ico">'+icon('zap')+'</span><div class="grow"><h3>Desafio misto</h3><p>'+MIX_SIZE+' perguntas sorteadas · '+bestTxt('mix')+'</p></div>'+icon('next')+'</button>'+
  '<div class="stack">'+LESSONS.map(function(L){
    var n=QUESTIONS.filter(function(q){return q.lesson===L.id;}).length;
    return '<button class="item-card" style="'+cvars(LCOL[L.id-1],L.id)+'" data-act="startQuiz" data-a="L'+L.id+'"><span class="ico">'+icon(L.icon)+'</span><div class="grow"><h3>'+esc(L.title)+'</h3><p>'+n+' perguntas · '+bestTxt('L'+L.id)+'</p></div>'+icon('next')+'</button>';
  }).join('')+'</div>';
}
function startQuiz(key){
  var pool;
  if(key==='mix') pool=shuffle(QUESTIONS).slice(0,MIX_SIZE);
  else{ var n=parseInt(key.slice(1),10); pool=shuffle(QUESTIONS.filter(function(q){return q.lesson===n;})); }
  var qs=pool.map(function(q){
    var opts=shuffle([{t:q.ok,ok:true}].concat(q.wrong.map(function(w){return {t:w,ok:false};})));
    return {id:q.id,t:q.t,opts:opts,exp:q.exp,okText:q.ok};
  });
  ui.quiz={key:key,qs:qs,i:0,score:0,answered:false,picked:-1,xpGain:0,scored:{},finished:false,bonus:0};
  ui.tab='play'; ui.playTab='quiz'; render();
}
function quizTitle(key){ if(key==='mix') return 'Desafio misto'; var L=LESSONS[parseInt(key.slice(1),10)-1]; return L?L.title:'Quiz'; }
function viewQuizRun(){
  var q=ui.quiz; if(q.finished) return viewQuizResult();
  var cur=q.qs[q.i], total=q.qs.length, done=q.i+(q.answered?1:0);
  var h='<div class="qhead"><span>'+esc(quizTitle(q.key))+'</span><span>Pergunta '+(q.i+1)+' de '+total+' · '+q.score+' pts</span></div>'+
   '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+done+'"><i style="width:'+Math.round(done/total*100)+'%"></i></div>'+
   '<h2 class="qtext">'+esc(cur.t)+'</h2><div class="stack">';
  cur.opts.forEach(function(o,i){
    var cls='opt';
    if(q.answered){ if(o.ok) cls+=' ok'; else if(i===q.picked) cls+=' bad'; else cls+=' dim'; }
    h+='<button class="'+cls+'" data-act="answer" data-k="'+i+'" data-a="'+i+'"'+(q.answered?' disabled':'')+'><span class="l">'+LETTERS[i]+'</span><span>'+esc(o.t)+'</span></button>';
  });
  h+='</div>';
  if(q.answered){
    var ok=cur.opts[q.picked].ok;
    h+='<div class="fb '+(ok?'ok':'bad')+'" aria-live="polite"><b>'+(ok?'Correto!':'Não foi dessa vez.')+'</b>'+(ok?'':'A resposta certa é: “'+esc(cur.okText)+'” ')+esc(cur.exp)+'</div>';
  }
  h+='<button class="btn primary block" data-act="nextQ"'+(q.answered?'':' disabled')+'>'+(q.answered?(q.i<total-1?'Próxima pergunta':'Ver resultado'):'Responda para continuar')+'</button>'+
     '<button class="back" data-act="quitQuiz" style="align-self:center">Sair do quiz</button>';
  return h;
}
function viewQuizResult(){
  var q=ui.quiz, total=q.qs.length, pct=Math.round(q.score/total*100);
  var stars=pct>=90?3:pct>=60?2:pct>0?1:0;
  var msg=pct===100?'Perfeito! Você domina este assunto.':pct>=80?'Muito bem! Você entendeu o essencial.':pct>=50?'Bom começo. Revise a aula e tente de novo.':'Revise a aula com calma e tente outra vez. Errar faz parte de aprender.';
  var starH=''; for(var i=0;i<3;i++) starH+='<span class="'+(i<stars?'on':'')+'">'+icon('star')+'</span>';
  var L=q.key==='mix'?null:LESSONS[parseInt(q.key.slice(1),10)-1];
  return '<section class="card stack" style="align-items:stretch"><div style="width:104px;margin:0 auto">'+mascot(pct>=50?'happy':'sad')+'</div><p class="eyebrow" style="text-align:center">'+esc(quizTitle(q.key))+'</p>'+
   '<div class="score-ring" style="--p:'+pct+'"><b>'+q.score+'/'+total+'</b></div>'+
   '<div class="stars" aria-label="'+stars+' de 3 estrelas">'+starH+'</div>'+
   '<p style="text-align:center;font-weight:600">'+msg+'</p>'+
   '<p class="xpgain">+'+q.xpGain+' XP</p>'+
   (q.xpGain===0?'<p class="small muted" style="text-align:center">Você já tinha dominado estas perguntas. O XP é dado na primeira vez que acerta cada uma.</p>':'')+
   (q.bonus?'<p class="small" style="text-align:center;color:var(--cyan)">Inclui '+q.bonus+' XP de bônus por acertar 80% ou mais.</p>':'')+
   '</section>'+
   '<button class="btn primary block" data-act="restartQuiz">'+icon('refresh')+' Jogar novamente</button>'+
   (L?'<button class="btn block" data-act="openLesson" data-a="'+L.id+'">Rever a aula</button>':'')+
   '<button class="btn block" data-act="quitQuiz">Escolher outro quiz</button>';
}
function answer(i){
  var q=ui.quiz; if(!q||q.answered||q.finished) return;
  var cur=q.qs[q.i], opt=cur.opts[i]; if(!opt) return;
  q.answered=true; q.picked=i;
  if(!q.scored[cur.id]){
    q.scored[cur.id]=true;
    if(opt.ok){
      q.score++; beep('ok');
      if(!state.mastered[cur.id]){ state.mastered[cur.id]=1; q.xpGain+=Q_XP; addXP(Q_XP); }
    } else beep('bad');
  }
  save(); afterChange(); render(true);
}
function nextQ(){
  var q=ui.quiz; if(!q||!q.answered) return;
  if(q.i<q.qs.length-1){ q.i++; q.answered=false; q.picked=-1; render(); return; }
  finishQuiz();
}
function finishQuiz(){
  var q=ui.quiz, total=q.qs.length;
  var b=state.quizBest[q.key];
  if(!b||q.score/total>b.s/b.t) state.quizBest[q.key]={s:q.score,t:total};
  state.quizPlays=(state.quizPlays||0)+1;
  if(q.key!=='mix'&&q.score/total>=0.8&&!state.quizBonus[q.key]){ state.quizBonus[q.key]=1; q.bonus=QUIZ_BONUS; q.xpGain+=QUIZ_BONUS; addXP(QUIZ_BONUS); }
  q.finished=true; save(); afterChange(); beep('lvl'); render();
}

var VIEWS={home:viewHome,learn:viewLearn,play:viewPlay,profile:viewProfile};

function render(keep){
  var y=window.scrollY||0;
  $('#top').innerHTML=headerHTML();

  var v=$('#view'); v.innerHTML=VIEWS[ui.tab]();
  if(!keep){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }

/* ============ AÇÕES ============ */
var A={
  nav:function(t){ ui.tab=t; if(t==='play'&&ui.quiz&&ui.quiz.finished) ui.quiz=null; render(); },
  openLesson:function(id){
    id=+id; ui.tab='learn'; ui.lesson=id; ui.act={done:false,items:{},wrong:{},picked:{},shake:-1}; render();
  },
  closeLesson:function(){ ui.lesson=null; render(); },
  classify:function(i,c,el){
    var r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
    var L=curLesson(), st=ui.act; if(!L||!st||st.done) return;
    i=+i; c=+c; var it=L.activity.items[i]; if(!it||st.items[i]!==undefined) return;
    if(c===it.a){ st.items[i]=c; st.shake=-1; beep('ok'); if(r) confetti(r.left+r.width/2,r.top+r.height/2,22); }
    else{ st.wrong[i]=st.wrong[i]||{}; st.wrong[i][c]=true; st.shake=i; beep('bad'); }
    if(Object.keys(st.items).length===L.activity.items.length) st.done=true;
    refreshLesson();
  },
  choose:function(i,b,el){
    var r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
    var L=curLesson(), st=ui.act; if(!L||!st||st.done) return;
    i=+i; var o=L.activity.options[i]; if(!o||st.picked[i]) return;
    st.picked[i]=true; if(o.ok){ st.done=true; beep('ok'); if(r) confetti(r.left+r.width/2,r.top+r.height/2,26); } else beep('bad');
    refreshLesson();
  },
  completeLesson:function(){
    var L=curLesson(); if(!L||!ui.act||!ui.act.done||state.lessons[L.id]) return;
    state.lessons[L.id]=Date.now(); save(); addXP(LESSON_XP); afterChange(); beep('ok'); render(true); confetti(window.innerWidth/2,window.innerHeight*0.55,120);
  },
  startQuiz:startQuiz,
  playTab:function(t){ ui.playTab=t; render(); },
  answer:function(i,b,el){ var r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null; answer(+i); var q=ui.quiz; if(r&&q&&q.picked===+i&&q.qs[q.i].opts[+i].ok) confetti(r.left+r.width/2,r.top+r.height/2,28); },
  nextQ:nextQ,
  restartQuiz:function(){ if(ui.quiz) startQuiz(ui.quiz.key); },
  quitQuiz:function(){ ui.quiz=null; ui.playTab='quiz'; render(); },
  goMission:function(id){ ui.tab='play'; ui.playTab='missions'; ui.openMission=+id; ui.quiz=null; render(); },
  toggleMission:function(id){ id=+id; ui.openMission=ui.openMission===id?null:id; render(true); },
  stepToggle:function(id,i){
    id=+id; i=+i; if(state.missions[id]) return;
    var m=MISSIONS.filter(function(x){return x.id===id;})[0]; if(!m||!m.steps[i]) return;
    var st=state.missionSteps[id]; if(!Array.isArray(st)) st=state.missionSteps[id]=[];
    st[i]=!st[i]; save(); render(true);
  },
  completeMission:function(id){
    id=+id; if(state.missions[id]) return;
    var m=MISSIONS.filter(function(x){return x.id===id;})[0]; if(!m) return;
    var st=state.missionSteps[id]||[]; if(!m.steps.every(function(_,i){return st[i];})) return;
    state.missions[id]=Date.now(); save(); addXP(MISSION_XP); afterChange(); beep('ok'); render(true); confetti(window.innerWidth/2,window.innerHeight*0.55,110);
  },
  saveName:function(){
    var el=$('#nameInput'); if(!el) return;
    state.name=el.value.replace(/\s+/g,' ').trim().slice(0,20); save(); toast(state.name?'Nome salvo: '+state.name:'Nome removido','xp','check'); render(true);
  },
  toggleSound:function(){ state.settings.sound=!state.settings.sound; save(); if(state.settings.sound) beep('ok'); render(true); },
  askReset:function(){
    showModal({title:'Apagar todo o progresso?',text:'Você vai perder XP, nível, aulas, missões, resultados de quizzes e conquistas deste aparelho. Isso não pode ser desfeito.',ok:'Sim, apagar tudo',onOk:function(){
      state=defaults(); save(); ui={tab:'home',lesson:null,playTab:'quiz',openMission:null,quiz:null,act:null};
      closeModal(); render(); toast('Progresso reiniciado','xp','refresh');
    }});
  },
  modalOk:function(){ var cb=modalCb; if(cb) cb(); else closeModal(); },
  modalCancel:closeModal,
  modalBg:function(a,b,el,ev){ if(ev&&ev.target===el) closeModal(); }
};

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null; if(!el||el.disabled) return;
  var f=A[el.getAttribute('data-act')]; if(f) f(el.getAttribute('data-a'),el.getAttribute('data-b'),el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#modal').firstChild) closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id==='nameInput'){ e.preventDefault(); A.saveName(); }
});

window.__conecta={state:function(){return state;},ui:function(){return ui;},LESSONS:LESSONS,QUESTIONS:QUESTIONS,MISSIONS:MISSIONS,ACH:ACH,LEVELS:LEVELS,levelInfo:levelInfo,isMemOnly:function(){return memOnly;}};

render();
checkAch();
if(Object.keys(state.ach).length) { /* conquistas já existentes não geram aviso */ }

try{
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}catch(e){}
})();
</script>
